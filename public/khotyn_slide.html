<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хотинська — слайд</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&subset=cyrillic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/layout.css">
<script>window.HOSPITAL_ORG_EDRPOU = '02005875';</script>
<script src="/js/layout-config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/page-shell.js"></script>
</head>
<body>
<div class="slide-wrapper">
  <div class="slide" id="slideRoot"></div>
</div>
<script>
  function scaleSlide() {
    const w = document.querySelector('.slide-wrapper');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    w.style.transform = `scale(${s})`;
  }
  window.addEventListener('load', scaleSlide);
  window.addEventListener('resize', scaleSlide);

  renderShell(document.getElementById('slideRoot'));
  initHospitalName();
</script>
</body>
</html>
