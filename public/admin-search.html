<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Пошук (власник)</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2430; --muted:#6b7585; --line:#e3e7ee; --accent:#4a78c9; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --card:#1c222c; --fg:#e8ecf3; --muted:#9aa5b8; --line:#2b3340; --accent:#7aa2e8; --warn:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .top a { color:var(--accent); text-decoration:none; font-size:14px; }
  h1 { font-size:18px; margin:0; flex:1; }
  .box { position:sticky; top:0; background:var(--bg); padding:6px 0 12px; z-index:2; }
  input[type=search] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
  input[type=search]:focus { outline:2px solid var(--accent); border-color:transparent; }
  .hint, .status { color:var(--muted); font-size:13px; margin:8px 2px 0; }
  .status.err { color:var(--warn); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 2px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .name { font-weight:600; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .row { margin-top:6px; font-size:14px; word-break:break-word; }
  .row b { font-weight:500; color:var(--muted); margin-right:6px; }
  .row a { color:var(--accent); text-decoration:none; }
  .hosp { margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; font-size:13px; }
  .hosp div { margin-top:3px; }
  .org { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:var(--bg); color:var(--muted); margin-left:6px; vertical-align:1px; }
  .more { color:var(--muted); font-size:13px; margin:2px 2px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Пошук пацієнтів і співробітників</h1><a href="/entry.html">← на сайт</a></div>
  <div class="box">
    <input id="q" type="search" placeholder="Прізвище, імʼя або телефон…" autocomplete="off" enterkeyhint="search" autofocus>
    <div class="hint" id="hint">Кілька слів у будь-якому порядку («іван коваль»); телефон у будь-якому форматі, навіть частину цифр (від 5).</div>
    <div class="status" id="status" role="status"></div>
  </div>
  <div id="out"></div>
</div>
<script src="/js/admin-search.js"></script>
</body>
</html>
